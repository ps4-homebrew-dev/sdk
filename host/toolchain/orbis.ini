[binaries]
c = '@DIRNAME@/../bin/orbis-clang'
cpp = '@DIRNAME@/../bin/orbis-clang++'
objc = '@DIRNAME@/../bin/orbis-clang'
objcpp = '@DIRNAME@/../bin/orbis-clang++'
ld = '@DIRNAME@/../bin/orbis-ld'
ar = '@DIRNAME@/../bin/orbis-ar'
strip = '@DIRNAME@/../bin/orbis-strip'
cmake = '@DIRNAME@/../bin/orbis-cmake'
pkg-config = '@DIRNAME@/../bin/orbis-pkg-config'
deploy = '@DIRNAME@/../bin/orbis-deploy'
elf2self = '@DIRNAME@/../bin/orbis-elf2self'
mksfo = '@DIRNAME@/../bin/orbis-mksfo'
mkgp4 = '@DIRNAME@/../bin/orbis-mkgp4'
mkpkg = '@DIRNAME@/../bin/orbis-mkpkg'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
prefix = '/usr'
default_library = 'static'

[properties]
needs_exe_wrapper = true
cmake_toolchain_file = '@DIRNAME@/orbis.cmake'
